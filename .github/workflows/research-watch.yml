name: Scientific and technology watch

on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * *"

permissions:
  contents: write

jobs:
  update-research-watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect arXiv, PubMed and HAL publications
        run: python scripts/update_research_watch.py

      - name: Commit updated research watch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-watch/research-data.json
          if git diff --cached --quiet; then
            echo "No research watch changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh scientific watch"
          git push origin "HEAD:${GITHUB_REF_NAME}"

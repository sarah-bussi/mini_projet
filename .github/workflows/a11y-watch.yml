name: Accessibility watch

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  update-watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect accessibility news, detect tools and verify links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_a11y_watch.py

      - name: Commit updated watch data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add a11y-tools/veille-data.json a11y-tools/link-status.json a11y-tools/detected-tools.json
          if git diff --cached --quiet; then
            echo "No watch changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh accessibility watch"
          git push origin "HEAD:${GITHUB_REF_NAME}"

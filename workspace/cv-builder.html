<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>CV Builder — Sarah Workspace</title>
  <link rel="stylesheet" href="workspace.css"/>
</head>
<body>
  <a class="skip-link" href="#main">Aller au contenu</a>
  <header class="workspace-header">
    <div class="shell header-row">
      <a class="workspace-brand" href="index.html">SB Workspace</a>
      <nav class="workspace-nav" aria-label="Navigation de l’espace privé">
        <a href="index.html">Dashboard</a>
        <a aria-current="page" href="cv-builder.html">CV Builder</a>
        <a href="copilot.html">A11Y Copilot</a>
      </nav>
    </div>
  </header>

  <main id="main" class="shell workspace-main">
    <section class="hero-panel">
      <p class="eyebrow">Candidatures</p>
      <h1>CV Builder</h1>
      <p>Pars d’un CV existant du portfolio et adapte-le à une offre sans inventer d’expérience, de compétence, de date ou de résultat.</p>
    </section>

    <section class="panel">
      <form id="cv-builder-form" class="workspace-form">
        <div class="two-col">
          <label>CV source
            <select name="cvSource" required>
              <option value="en">CV anglais — cv-en.html</option>
              <option value="fr">CV français — cv.html</option>
            </select>
          </label>
          <label>Langue de sortie
            <select name="outputLanguage" required>
              <option value="en">Anglais</option>
              <option value="fr">Français</option>
            </select>
          </label>
        </div>

        <div class="two-col">
          <label>Poste visé
            <input name="jobTitle" required />
          </label>
          <label>Entreprise
            <input name="company" />
          </label>
        </div>

        <label>Offre / description
          <textarea name="offer" required placeholder="Colle ici l’offre complète."></textarea>
        </label>

        <label>Éléments à mettre en avant
          <textarea name="focus" placeholder="Ex. WCAG, audits, accompagnement design/dev, QA, technologies d’assistance…"></textarea>
        </label>

        <button class="primary-button" type="submit">Adapter le CV existant</button>
        <p id="cv-status" class="status-line" aria-live="polite"></p>
      </form>

      <section aria-labelledby="cv-result-title">
        <h2 id="cv-result-title">Proposition</h2>
        <div id="cv-result" class="result-box">La version adaptée apparaîtra ici.</div>
      </section>
    </section>
  </main>

  <script src="workspace-config.js"></script>
  <script src="guard.js"></script>
  <script src="workspace-ai.js"></script>
</body>
</html>
